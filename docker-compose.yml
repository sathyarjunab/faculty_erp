# ─────────────────────────────────────────────────────────────
# Local MySQL for the Faculty AMS backend.
#
# Runs a throwaway MySQL server with credentials that match server/.env,
# so you don't need the password of your existing local MySQL install.
#
#   Start:   docker compose up -d
#   Stop:    docker compose down
#   Wipe:    docker compose down -v   (deletes all data, fresh start)
#
# Host port 3307 is used to avoid clashing with a local MySQL on 3306.
# server/.env has DB_PORT=3307 to point the app here.
# ─────────────────────────────────────────────────────────────
services:
  mysql:
    image: mysql:8.0
    container_name: faculty_ams_mysql
    restart: unless-stopped
    ports:
      - "3307:3306"          # host:container
    environment:
      MYSQL_ROOT_PASSWORD: "rootpass"      # root user, for DB tools if you need it
      MYSQL_DATABASE: "faculty_ams"        # created automatically on first run
      MYSQL_USER: "sathyarjun"             # matches DB_USER in server/.env
      MYSQL_PASSWORD: "sathya@62710"       # matches DB_PASSWORD in server/.env
    volumes:
      - faculty_ams_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  faculty_ams_mysql_data:
